
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>XyloNet Base Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
        }

        /* LAYOUT */
        #sidebar-container {
            position: absolute; top: 0; left: 0; bottom: 0; width: 350px;
            background: #fcfcfc; border-right: 1px solid #e0e0e0;
            display: flex; flex-direction: column; z-index: 50;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        #map-container {
            position: absolute; top: 0; right: 0; bottom: 0; left: 350px;
            background: white; z-index: 1;
        }

        .plotly-graph-div { height: 100% !important; width: 100% !important; position: absolute; top: 0; left: 0; }

        /* STYLES */
        .sidebar-header {
            background: #2c3e50; color: white; padding: 20px 25px;
            border-bottom: 4px solid #f1c40f;
        }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
        .sidebar-header .subtitle { font-size: 11px; opacity: 0.7; margin-top: 5px; text-transform: uppercase; }

        .sidebar-content { flex-grow: 1; overflow-y: auto; padding: 0; }

        table { width: 100%; border-collapse: collapse; }
        tr { border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #f9f9f9; }

        th { 
            padding: 10px 15px; text-align: left; 
            font-weight: 600; color: #555; 
            font-size: 11px; width: 65%; 
        }
        td { 
            padding: 10px 15px; text-align: right; 
            font-weight: 600; color: #2c3e50; 
            font-size: 12px; 
        }

        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
        .dot-yes { background-color: #FFD700; border: 1px solid #d4b100; } 
        .dot-no  { background-color: #4169E1; border: 1px solid #2850c7; } 
        .dot-na  { background-color: #eee; border: 1px solid #ddd; }

        #empty-state { padding: 40px; text-align: center; color: #bdc3c7; font-style: italic; margin-top: 20%; }

        #sidebar-container .sidebar-content::-webkit-scrollbar { width: 6px; }
        #sidebar-container .sidebar-content::-webkit-scrollbar-thumb { background: #dcdcdc; border-radius: 3px; }
    </style>
</head>

        function showDetails(nodeID) {
            document.getElementById('empty-state').style.display = 'none';
            var data = featureData[nodeID];

            if (!data) return;

            var html = "<table>";
            if(data["00_Class"]) html += "<tr style='background:#f4f6f7'><th style='color:#2c3e50'>Species</th><td style='font-size:13px'>" + data["00_Class"] + "</td></tr>";

            // --- UPDATED SORTING LOGIC ---
            // numeric: true ensures "2" comes before "10"
            var keys = Object.keys(data).sort(function(a, b) {
                return a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
            });

            for (var i = 0; i < keys.length; i++) {
                var k = keys[i];
                if(k.startsWith("00_")) continue;

                var v = data[k];
                var displayHTML = "";

                if (v === "Yes") displayHTML = "<span class='dot dot-yes'></span>Present";
                else if (v === "No") displayHTML = "<span class='dot dot-no'></span>Absent";
                else if (v === "-") continue; 
                else displayHTML = "<span class='dot dot-na'></span>" + v;

                html += "<tr><th>" + k + "</th><td>" + displayHTML + "</td></tr>";
            }
            html += "</table>";
            document.getElementById('table-wrapper').innerHTML = html;
        }

        if (graphDiv) {
            const observer = new ResizeObserver(() => Plotly.Plots.resize(graphDiv));
            observer.observe(mapContainer);
            setTimeout(() => Plotly.Plots.resize(graphDiv), 100);

            graphDiv.on('plotly_click', (d) => {
                if(d.points[0].customdata) showDetails(d.points[0].customdata);
            });
        }
    </script>
</body>
</html>
